worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile        on;
    keepalive_timeout 65;

    # Increase proxy buffer sizes to handle large response headers from backend
    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Re-resolve backend hostname dynamically (required when proxying to external URLs)
        resolver 1.1.1.1 8.8.8.8 valid=30s ipv6=off;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Content-Security-Policy:
        #   default-src 'self'                — block all unlisted sources by default
        #   script-src 'self' 'unsafe-inline' — Vite bundles inline scripts at build time
        #   style-src 'self' 'unsafe-inline'  — Tailwind / inline styles
        #   img-src 'self' data:              — data URIs used for favicon/icons
        #   font-src 'self'                   — self-hosted fonts only
        #   connect-src 'self'                — XHR/fetch only to same origin (proxied backend)
        #   frame-ancestors 'none'            — equivalent to X-Frame-Options DENY (belt + suspenders)
        #   base-uri 'self'                   — block <base> tag hijacking
        #   form-action 'self'                — block form submissions to external sites
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # SPA routing — fall back to index.html for client-side routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proxy API calls to backend
        location /api/ {
            set $backend ${BACKEND_URL};
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # Proxy auth calls to backend
        location /auth/ {
            set $backend ${BACKEND_URL};
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
        }

        # Cache static assets
        # NOTE: re-declare security headers here — nginx child location blocks
        # do NOT inherit add_header directives from the parent server block.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Health check endpoint
        location /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }
}
