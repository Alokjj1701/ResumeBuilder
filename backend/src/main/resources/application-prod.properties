# ── Production overrides ──────────────────────────────────────────────────────
# These settings are merged on top of application.properties when
# SPRING_PROFILES_ACTIVE=prod (set this in Railway backend variables).

# Disable Swagger UI and API docs — never expose schema in production
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Secure cookies — requires HTTPS (Railway provides TLS termination)
app.cookie.secure=true

# Reduce log verbosity in production
logging.level.com.resumebuilder=WARN
logging.level.org.springframework.security=WARN

# Actuator — restrict health detail to authorized users only
management.endpoint.health.show-details=never
