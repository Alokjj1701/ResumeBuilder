# Server
server.port=8080

# DataSource
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:resumebuilder}
spring.datasource.username=${DB_USER:resumeuser}
spring.datasource.password=${DB_PASSWORD:resumepass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# SQL Initialization (seed data)
# defer=true ensures data.sql runs AFTER Hibernate creates/updates the schema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# SpringDoc
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ── Email / SMTP ─────────────────────────────────────────────────────────────
# For Gmail: use an App Password (Google Account → Security → App Passwords)
# For SendGrid: host=smtp.sendgrid.net port=587 username=apikey password=<API_KEY>
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:your-email@gmail.com}
spring.mail.password=${SMTP_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.email.from-name=${EMAIL_FROM_NAME:Resume Builder}

# ── OTP ───────────────────────────────────────────────────────────────────────
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:10}

# ── JWT ──────────────────────────────────────────────────────────────────────
# IMPORTANT: Set JWT_SECRET to a random 32+ character string in production
app.jwt.secret=${JWT_SECRET:dev-secret-key-change-in-prod-must-be-32-chars-min!!}
app.jwt.access-token-expiry-minutes=${JWT_ACCESS_EXPIRY_MINUTES:15}
app.jwt.refresh-token-expiry-days=${JWT_REFRESH_EXPIRY_DAYS:7}

# ── Cookie ───────────────────────────────────────────────────────────────────
# Set to true in production (requires HTTPS)
app.cookie.secure=${COOKIE_SECURE:false}

# ── CORS ─────────────────────────────────────────────────────────────────────
# Comma-separated list of allowed origins. Add Railway frontend URL here for prod.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000,http://frontend,http://frontend:80}

# Logging
logging.level.com.resumebuilder=INFO
