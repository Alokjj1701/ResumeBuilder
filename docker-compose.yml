version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: resume-builder-db
    environment:
      POSTGRES_DB: ${DB_NAME:-resumebuilder}
      POSTGRES_USER: ${DB_USER:-resumeuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-resumepass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-resumeuser} -d ${DB_NAME:-resumebuilder}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - resume-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume-builder-backend
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-resumebuilder}
      DB_USER: ${DB_USER:-resumeuser}
      DB_PASSWORD: ${DB_PASSWORD:-resumepass}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - resume-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty = use Nginx reverse proxy (recommended). Override for external deployments.
        - VITE_API_BASE_URL=${API_BASE_URL:-}
    container_name: resume-builder-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - resume-network
    restart: unless-stopped

volumes:
  postgres_data:
    name: resume-builder-postgres-data

networks:
  resume-network:
    name: resume-builder-network
    driver: bridge
